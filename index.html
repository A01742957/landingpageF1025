<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Impulse-X — Lanzamientos por venir.">
  <title>Impulse-X | Lanzamientos por venir</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="launch-screen">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <header class="brand">
      <img src="assets/logo-horizontal.png" alt="Impulse-X — Equipo de cohetería" class="wordmark">
    </header>
    <section class="hero" aria-labelledby="launch-title">
      <div class="orbit orbit-outer" aria-hidden="true"></div>
      <div class="orbit orbit-inner" aria-hidden="true"></div>
      <div class="logo-wrap">
        <img src="assets/logo-circular.png" alt="Logotipo circular de Impulse-X: cohete y llama" class="rocket-logo">
      </div>
      <p class="eyebrow"><span></span> PROYECTO F1025B <span></span></p>
      <h1 id="launch-title">Lanzamientos<br><em>por venir...</em></h1>
      <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>
    <footer class="footer">
      <span>IMPULSE-X</span>
      <span class="footer-line"></span>
      <span>EQUIPO DE COHETERÍA</span>
    </footer>
  </main>
</body>
</html>
